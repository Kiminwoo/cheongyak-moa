name: Verify application

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Check workspace boundaries
        run: npm run lint
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build React application
        run: npm run build
      - name: Test API, matching, storage and PWA
        run: npm test
      - name: Test React components
        run: npm run test:ui
